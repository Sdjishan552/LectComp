<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bank Prep Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7c6cff"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PrepTracker">
<style>
:root{--ink:#26224a;--mut:#8481a6;--red:#ff4757;--p:#6c5ce7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(120deg,#f1ecff,#e3f6ff,#e9fff4,#fff0f3,#f1ecff);min-height:100vh;padding:env(safe-area-inset-top) 0 115px}
@keyframes bg{50%{background-position:100% 50%}}
.blob{position:fixed;border-radius:50%;opacity:.6;z-index:-1;pointer-events:none}
@keyframes fl{to{transform:translate(50px,70px) scale(1.25)}}
#v{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:28px;font-weight:800;letter-spacing:-.6px;background:linear-gradient(90deg,#6c5ce7,#fd79a8,#00b894,#6c5ce7);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes slide{to{background-position:200% 0}}
.sub{color:var(--mut);font-size:13.5px;margin:2px 0 10px;font-weight:500}
.card{--c:#6c5ce7;--c2:#a29bfe;position:relative;overflow:hidden;background:rgba(255,255,255,.9);border:1px solid #fff;border-radius:26px;padding:22px 18px 14px;margin:16px 0;box-shadow:0 16px 36px -12px rgba(108,92,231,.4);animation:up .35s ease-out both;animation-delay:calc(var(--i)*40ms);transition:transform .25s,box-shadow .25s}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:7px;background:linear-gradient(90deg,var(--c),var(--c2),var(--c));background-size:200%}
.card::after{content:'';position:absolute;right:-45px;top:-45px;width:150px;height:150px;border-radius:50%;background:radial-gradient(var(--c2),transparent 70%);opacity:.22;pointer-events:none}
.card.R{--c:#00a99d;--c2:#4ee3a8}
.card.locked{opacity:.62;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.9) 0 12px,rgba(238,234,255,.9) 12px 24px)}
.card.danger{--c:#ff4757;--c2:#ff9aa5;box-shadow:0 0 0 3px rgba(255,71,87,.25),0 12px 24px -10px rgba(255,71,87,.5)}
@media(hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 22px 42px -12px rgba(108,92,231,.5)}}
@keyframes up{from{opacity:0;transform:translateY(30px) scale(.95)}}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,71,87,.22),0 16px 36px -10px rgba(255,71,87,.5)}}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);font-weight:600}
.chip{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-radius:99px;padding:5px 13px;font-weight:800;font-size:12px;box-shadow:0 6px 12px -5px var(--c)}
h3{font-size:22px;font-weight:800;letter-spacing:-.3px;margin:12px 0 6px}
.warn{background:linear-gradient(90deg,#ffe3e6,#fff3f4);color:#d6283a;border-radius:14px;padding:9px 13px;font-weight:800;font-size:14px;margin-bottom:6px}
@keyframes wob{0%,90%,100%{transform:none}93%{transform:translateX(-4px)}96%{transform:translateX(4px)}}
.lec{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:linear-gradient(90deg,#f1edff,#fff);border:1.5px solid #e6e0ff;margin:9px 0;cursor:pointer;font-weight:700;transition:transform .2s,background .3s,box-shadow .3s}
.card.R .lec{background:linear-gradient(90deg,#e4faf2,#fff);border-color:#c9f1e3}
.lec:hover{transform:translateX(3px);box-shadow:0 8px 18px -8px var(--c)}.lec:active{transform:scale(.97)}
.lec small{margin-left:auto;color:var(--mut);font-weight:600;font-size:12px}
.ck{flex:none;width:32px;height:32px;border-radius:50%;border:3px solid var(--c);background:#fff;display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;transition:.3s}
.lec.on{background:linear-gradient(90deg,#d6f8e6,#e6f0ff)!important;border-color:#b8ecd2}
.lec.on span:nth-child(2){text-decoration:line-through;text-decoration-thickness:2px;color:var(--mut)}
.lec.on .ck{background:linear-gradient(135deg,#00c9a0,#6c5ce7);border-color:transparent;animation:pop .5s,rip .7s}
@keyframes pop{40%{transform:scale(1.6) rotate(20deg)}}
@keyframes rip{from{box-shadow:0 0 0 0 rgba(0,201,160,.55)}to{box-shadow:0 0 0 18px rgba(0,201,160,0)}}
button{font:inherit;border:0;cursor:pointer}
.ghost{background:linear-gradient(135deg,#fff3dc,#ffe7c2);color:#b86a00;border-radius:14px;padding:10px 15px;font-weight:800;margin:8px 0;transition:.2s;box-shadow:0 6px 14px -8px rgba(255,150,0,.7)}.ghost:active{transform:scale(.95)}
.btn{position:relative;overflow:hidden;width:100%;margin-top:12px;padding:14px 18px;border-radius:16px;color:#fff;font-weight:800;background:linear-gradient(90deg,#6c5ce7,#a55eea,#fd79a8,#6c5ce7);background-size:200%;box-shadow:0 10px 22px -8px rgba(108,92,231,.7);transition:transform .2s}
.btn::after,.free::after{content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);display:none}
@keyframes swp{55%,100%{left:140%}}.btn:active{transform:scale(.97)}
.hero{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#fff,#f3eeff 60%,#ffeef4);border:1px solid #fff;border-radius:28px;padding:18px;margin:14px 0;box-shadow:0 18px 40px -14px rgba(253,121,168,.55);animation:up .6s both}
.hero b{display:block;line-height:1;font-size:34px!important;font-weight:800;background:linear-gradient(90deg,#6c5ce7,#fd79a8);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring{flex:none;transform:rotate(-90deg);filter:drop-shadow(0 6px 10px rgba(108,92,231,.35))}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}.ring .bg{stroke:#eae4ff}
.ring .fg{stroke:url(#g);stroke-dasharray:276.5;animation:rg 1.3s cubic-bezier(.3,.8,.3,1)}
@keyframes rg{from{stroke-dashoffset:276.5}}
.sec{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;margin:26px 0 8px}
.sec::after{content:'';flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,#d9d2ff,transparent)}
.row{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:20px;padding:11px 14px 11px 18px;margin:9px 0;box-shadow:0 4px 12px -8px rgba(108,92,231,.5)}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(#6c5ce7,#a29bfe)}
.row.R::before{background:linear-gradient(#00a99d,#4ee3a8)}
.row.over::before,.row.dg::before{background:linear-gradient(#ff4757,#ff9aa5)}
.row[style*="fdcb6e"]::before{background:linear-gradient(#ffb84d,#ffd88a)}
.row.over,.row.dg{background:#fff4f5}.row.locked{opacity:.55}
.row.today{box-shadow:0 0 0 3px #ffd36e}
@keyframes glow{50%{box-shadow:0 0 0 3px #ffd36e,0 10px 26px -6px rgba(255,184,77,.8)}}
.row .d{min-width:46px;padding:6px 4px;border-radius:14px;background:#f1edff;text-align:center;font-weight:800;font-size:18px;line-height:1.05}
.row small{display:block;color:var(--mut);font-size:11.5px;font-weight:600;margin-top:2px}
.row .g{flex:1}.row .g b{font-size:15px;font-weight:800}
.bar{height:16px;background:#ebe6ff;border-radius:99px;overflow:hidden;margin:6px 0 14px;box-shadow:inset 0 2px 4px rgba(108,92,231,.12)}
.bar i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 8px,transparent 8px 16px),linear-gradient(90deg,var(--c),var(--c2,var(--c)));background-size:32px 32px,100%;animation:bw .8s cubic-bezier(.2,.8,.2,1)}
@keyframes bw{from{width:0}}@keyframes stripe{to{background-position:32px 0,0 0}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border:1px solid #fff;border-radius:22px;padding:16px 10px;text-align:center;box-shadow:0 10px 24px -12px rgba(108,92,231,.55);animation:up .5s both;animation-delay:calc(var(--i)*90ms);transition:transform .2s}.stat:active{transform:scale(.96)}
.stat:nth-child(1){background:linear-gradient(135deg,#fff,#ffe9d6)}.stat:nth-child(2){background:linear-gradient(135deg,#fff,#dcf8ec)}.stat:nth-child(3){background:linear-gradient(135deg,#fff,#e6e0ff)}.stat:nth-child(4){background:linear-gradient(135deg,#fff,#ffe1ec)}
.stat b{display:block;font-size:30px;font-weight:800}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.free{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;color:#fff;background:linear-gradient(100deg,#ff4757,#ff6b81,#ff8e53,#ff4757);background-size:200%;border-radius:20px;padding:12px 14px;margin-bottom:14px;box-shadow:0 12px 26px -8px rgba(255,71,87,.6);animation:up .4s both}
.free.crit{box-shadow:0 0 0 3px rgba(255,71,87,.3),0 12px 26px -8px rgba(255,71,87,.6)}
.free div{flex:1}.free b{font-size:15.5px;font-weight:800}.free small{display:block;opacity:.92;font-size:12px;font-weight:600;margin-top:1px}
.free button{position:relative;z-index:1;background:#fff;color:#e03449;border-radius:14px;padding:9px 13px;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.14);transition:.2s}.free button:active{transform:scale(.92)}
nav{position:fixed;z-index:5;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:536px;margin:auto;display:flex;gap:4px;background:rgba(255,255,255,.97);border:1px solid #fff;border-radius:28px;padding:7px;box-shadow:0 16px 44px -10px rgba(108,92,231,.55)}
nav button{flex:1;background:none;padding:11px 6px;border-radius:21px;font-weight:700;font-size:14px;color:var(--mut);transition:.35s cubic-bezier(.3,1.4,.5,1)}
nav button.on{color:#fff;background:linear-gradient(100deg,#6c5ce7,#a55eea,#fd79a8);box-shadow:0 10px 20px -6px rgba(108,92,231,.7);transform:translateY(-4px);animation:navp .5s}
@keyframes navp{50%{transform:translateY(-10px) scale(1.07)}}
select,input[type=date],input[type=search]{width:100%;padding:13px 14px;margin-top:10px;border-radius:14px;border:2px solid #e2dcff;background:#faf9ff;color:var(--ink);font:inherit;font-weight:600;outline:none;transition:.25s}
select:focus,input:focus{border-color:#6c5ce7;background:#fff;box-shadow:0 0 0 4px rgba(108,92,231,.15)}
.cl{max-height:220px;overflow-y:auto;margin-top:10px;padding:6px;border-radius:18px;background:linear-gradient(180deg,#f3f0ff,#fbf9ff);display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.ci{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:#fff;font-weight:700;font-size:14px;cursor:pointer;border:2px solid transparent;transition:.25s}
.ci small{margin-left:auto;color:var(--mut);font-weight:600;white-space:nowrap}
.ci.on{border-color:#6c5ce7;background:linear-gradient(90deg,#efeaff,#fff);box-shadow:0 6px 14px -8px #6c5ce7;transform:translateX(4px)}.ci:active{transform:scale(.97)}
.md{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:20px;background:rgba(38,34,74,.45);animation:fi .2s both}
.md>div{width:100%;max-width:380px;background:#fff;border-radius:28px;padding:24px;box-shadow:0 30px 60px -20px rgba(38,34,74,.6);animation:spring .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fi{from{opacity:0}}@keyframes spring{from{opacity:0;transform:scale(.8) translateY(30px)}}
.toast{position:fixed;z-index:20;top:16px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#26224a,#4a3f8f);color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;box-shadow:0 12px 26px -8px rgba(38,34,74,.6);animation:td .4s cubic-bezier(.2,1.3,.4,1) both}
@keyframes td{from{opacity:0;transform:translate(-50%,-24px)}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:30;animation:fall 1.9s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.gate{text-align:center;padding:11vh 8px 0}.gi{font-size:58px;margin-bottom:6px}.gate .sub{max-width:340px;margin:8px auto 18px;font-size:15px}.gate .btn,.gate .ghost{max-width:320px}.gate .warn{max-width:340px;margin:0 auto 14px;animation:none;text-align:left}
.sy{position:fixed;z-index:6;top:calc(8px + env(safe-area-inset-top));right:12px;padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.92);box-shadow:0 6px 14px -8px rgba(38,34,74,.6);color:#00936f}
.sy.sv{color:#b86a00}.sy.er{color:#d6283a}
.na .card,.na .hero,.na .stat,.na .free,.na .ring .fg,.na .bar i{animation:none!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>
<div class="blob" style="width:300px;height:300px;background:radial-gradient(circle,#a29bfe,transparent 68%);top:-80px;left:-80px"></div><div class="blob" style="width:260px;height:260px;background:radial-gradient(circle,#55efc4,transparent 68%);bottom:80px;right:-80px;animation-delay:-5s"></div><div class="blob" style="width:220px;height:220px;background:radial-gradient(circle,#fd79a8,transparent 68%);top:40%;left:50%;animation-delay:-9s"></div>
<svg width="0" height="0"><defs><linearGradient id="g"><stop offset="0" stop-color="#6c5ce7"/><stop offset="1" stop-color="#00b894"/></linearGradient></defs></svg>
<div id="v"></div>
<nav><button data-t="today" onclick="go('today')">🎯 Today</button><button data-t="plan" onclick="go('plan')">🗓️ Plan</button><button data-t="stats" onclick="go('stats')">📊 Stats</button></nav>
<div id="sy" class="sy" style="display:none"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=s=>document.querySelector(s),START='2026-10-08';
const P=(s,sub,ph)=>s.split(',').map(x=>{const[n,t]=x.split(':');return{name:n,total:+t,sub,ph}});
const PM=P("Ratio:4,Profit & Loss:7,Simple Interest:3,Compound Interest:3,Mixture:5,Age:3,Partnership:4,Time & Work:6,Pipes & Cistern:3,Average:2,Speed Time & Distance:4,Problems on Train:3,Boat & Stream:3,Mensuration 2D:2,Mensuration 3D:2,Permutation + Combination:2,Probability:2,DI:3,Caselet DI:1",'M','pre');
const PR=P("Distance & Direction:3,Coding-Decoding:3,Order & Ranking:3,Alphabets:5,Blood Relation:4,Input-Output:3,Circular Arrangement:2,Square/Rectangle Arrangement:8,Floor Puzzle:4,Box Puzzle:4,Sequencing Puzzle:3,Scheduling Weekly:3,Scheduling Monthly:5,Scheduling Yearly:4,Tabular Puzzle:3,HOT Category 1:5,HOT Category 2:4,HOT Category 3:1,Triangular Arrangement:2",'R','pre');
const MM=P("Percentage:2,Ratio:2,Profit & Loss:2,Mixture & Alligation:2,Age:2,Partnership:2",'M','mains');
const MR=P("Input-Output:8,Inequality:4,Syllogism:5,Direction & Distance:2,Coding-Decoding:5,Order & Ranking:1,Alphabets:2,Blood Relation:2,Data Sufficiency:3,Analytical Reasoning:4,Puzzle:10",'R','mains');
MM.forEach(c=>c.labels=['Arithmetic','DI']);PM[15].labels=['Permutation','Combination'];
const mix=(a,b)=>{const o=[];for(let i=0;i<Math.max(a.length,b.length);i++){a[i]&&o.push(a[i]);b[i]&&o.push(b[i])}return o};
const CH=[...mix(PM,PR),...mix(MM,MR)];CH.forEach((c,i)=>c.id='c'+i);
let BL=[];
const DEF=()=>({done:{},delay:{},log:{},bonus:{},bc:{},skips:[],order:CH.map(c=>c.id)});
let S=Object.assign(DEF(),{sim:''}),tab='today',D=[],SH=[],ready=false;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)},diff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const today=()=>S.sim||iso(new Date()),fd=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const MAXF=7,BASE_END=add(START,80),PRE_BASE=add(START,54),unf=()=>S.order.map(i=>CH.find(c=>c.id==i)).filter(c=>dc(c)<c.total),lab=(c,n)=>c.labels?c.labels[n-1]:'Lecture '+n,dc=c=>Math.min(c.total,S.done[c.id]||0);
const dn=b=>Math.max(0,Math.min(b.b,S.done[b.ch.id]||0)-b.a+1),full=b=>dn(b)==b.b-b.a+1;
function calc(){BL=[];S.order.forEach(id=>{const c=CH.find(x=>x.id==id);if((S.bc[id]||0)>=c.total)return;for(let a=1;a<=c.total;a+=3)BL.push({ch:c,a,b:Math.min(c.total,a+2),idx:BL.length})});
 let d=START,s=0;D=[];SH=[];BL.forEach(b=>{if(b.ch.ph=='mains'){const x=S.delay[b.idx]||0;s+=x;d=add(d,x)}while(S.skips.includes(d))d=add(d,1);D.push(d);SH.push(b.ch.ph=='mains'?s:0);d=add(d,1)})}
const preLast=()=>{let k=0;BL.forEach((b,i)=>{if(b.ch.ph=='pre')k=i});return k},preOpen=()=>unf().some(c=>c.ph=='pre'),free=()=>MAXF-diff(PRE_BASE,D[preLast()]);
function bn(){const e=D[D.length-1],late=diff(BASE_END,e),dl=diff(add(BASE_END,MAXF),e),po=preOpen(),f=free();let t,s;
 if(po){t=`🚨 ${f} free day${f==1?'':'s'} left`;s=`Finish ${fd(e)}`}
 else{t=late>0?`🚨 Pushed to ${fd(e)} (+${late}d)`:`🎯 On target`;s=dl>0?`Over deadline by ${dl} day${dl==1?'':'s'}`:`Finish ${fd(e)}`}
 return `<div class="free ${(po?f<=2:late>0)?'crit':''}"><div><b>${t}</b><small>${s}</small></div><button onclick="openSkip()">🌴 Rest</button></div>`}
function openSkip(){const m=document.createElement('div');m.className='md';
 m.innerHTML=`<div><h3>🌴 Rest day</h3><div class="sub">${preOpen()?`Free days left: <b style="color:#d6283a">${free()}</b> (max ${MAXF}).`:'No limit in Mains.'}</div>${S.skips.map(s=>`<div class="row" style="--i:0;border-left-color:#fdcb6e"><div class="g"><b>🌴 ${fd(s)}</b></div><button class="ghost" style="margin:0" onclick="unskip('${s}')">Undo</button></div>`).join('')}<input type="date" id="sd" min="${START}" value="${today()}"><button class="btn" id="sv">Take this rest day</button><button class="ghost" style="width:100%" id="cx">Close</button></div>`;document.body.append(m);
 $('#cx').onclick=()=>m.remove();$('#sv').onclick=()=>{const v=$('#sd').value;if(!v||v<START)return toast('Pick a valid date');if(S.skips.includes(v))return toast('Already a rest day');if(S.log[v]>0)return toast('You studied on that day');S.skips.push(v);S.skips.sort();calc();if(preOpen()&&free()<0){S.skips=S.skips.filter(x=>x!=v);calc();return toast('No free Prelims days left')}save();m.remove();render();toast('🌴 Rest day taken. Schedule shifted +1 day')}}
function unskip(s){S.skips=S.skips.filter(x=>x!=s);save();document.querySelector('.md')?.remove();render();toast('Rest day removed')}
let NS=null;
const nopts=(u,f,q)=>{const l=u.filter(c=>c.ph==f.ph&&c.name.toLowerCase().includes(q));return l.length?l.map(c=>`<div class="ci${NS==c.id?' on':''}" onclick="selCh('${c.id}',this)"><span>${c.sub=='M'?'➗':'🧩'}</span>${c.name}<small>${c.total} lec</small></div>`).join(''):'<div class="sub" style="padding:10px">No match</div>'};
function fsel(){const u=unf();$('#ns').innerHTML=nopts(u,u[0],$('#ps').value.toLowerCase().trim())}
function selCh(id,el){NS=id;document.querySelectorAll('.ci').forEach(e=>e.classList.toggle('on',e==el))}
function pick(){NS=null;const u=unf();if(!u.length)return'';const f=u[0];
 if(dc(f)>0)return `<div class="card ${f.sub}" style="--i:5"><h3>🔒 ${f.name}</h3><div class="sub">Frozen at ${dc(f)}/${f.total}. Finish it to switch chapter.</div></div>`;
 return `<div class="card ${f.sub}" style="--i:5"><h3>🔀 Choose next chapter</h3><input type="search" id="ps" placeholder="🔍 Search chapters…" oninput="fsel()"><div class="cl" id="ns">${nopts(u,f,'')}</div><button class="btn" onclick="setNext()">Set as next chapter</button></div>`}
function setNext(){const id=NS,f=unf()[0];if(!id)return toast('Pick a chapter first');if(id==f.id)return toast('That is already your next chapter');S.order=S.order.filter(x=>x!=id);S.order.splice(S.order.indexOf(f.id),0,id);save();render();toast('Next chapter updated')}
function stat(i){const b=BL[i],t=today();return full(b)?'done':D[i]>t?'locked':D[i]<t?'over':'today'}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function pop(n=45){const C=['#6c5ce7','#00b894','#fd79a8','#fdcb6e','#0984e3','#e17055'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${C[i%6]};animation-delay:${Math.random()*.5}s;border-radius:${i%2?'50%':'2px'}`;document.body.append(e);setTimeout(()=>e.remove(),2600)}}
function tick(i,n){const b=BL[i],id=b.ch.id,c=S.done[id]||0;if(D[i]>today())return toast('🔒 Locked until '+fd(D[i]));
 let up;if(n==c+1)up=1;else if(n==c)up=-1;else return toast('Finish the earlier lecture first');
 S.done[id]=c+up;const k=today();S.log[k]=Math.max(0,(S.log[k]||0)+up);save();render();if(up>0&&full(b)){pop(70);toast('🎉 '+b.ch.name+' block complete!')}else if(up>0)pop(14)}
function card(i,n0){const b=BL[i],c=b.ch,st=stat(i),dg=!full(b)&&(st=='over'||SH[i]>0);let r='';
 for(let n=b.a;n<=b.b;n++){const o=(S.done[c.id]||0)>=n;r+=`<div class="lec ${o?'on':''}" onclick="tick(${i},${n})"><span class="ck">${o?'✓':''}</span><span>${lab(c,n)}</span><small>${n}/${c.total}</small></div>`}
 return `<div class="card ${c.sub} ${st} ${dg?'danger':''}" style="--i:${n0}"><div class="top"><span class="chip">${c.sub=='M'?'➗ Maths':'🧩 Reasoning'} · ${c.ph=='pre'?'Prelims':'Mains'}</span><span>${st=='locked'?'🔒 ':''}${fd(D[i])}</span></div><h3>${c.name}</h3>${dg?`<div class="warn">🚨 ${st=='over'?'Overdue':''}${SH[i]>0?' Delayed +'+SH[i]+'d':''}</div>`:''}${r}${c.ph=='mains'&&!full(b)?`<button class="ghost" onclick="openDelay(${i})">⏳ Delay this block</button>`:''}</div>`}
function vToday(){const t=today();let h=`<h1>Bank Prep Tracker</h1><div class="sub">${fd(t)} · ${t<START?'Starts '+fd(START):'Day '+(diff(START,t)+1)}</div>`;
 if(S.skips.includes(t))h+=`<div class="card" style="--i:0"><h3>🌴 Rest day</h3></div>`;const pk=pick();
 const ix=BL.map((_,i)=>i).filter(i=>D[i]==t||(D[i]<t&&!full(BL[i])));
 if(!ix.length){const nx=BL.findIndex((b,i)=>D[i]>t);h+=nx<0?`<div class="hero"><h3>🏆 Every lecture is complete!</h3></div>`:`<div class="hero"><div><h3>${t<START?'Get ready!':'Nothing due today'}</h3></div></div>`+(nx<0?'':card(nx,1));return h+pk}
 const tot=ix.reduce((a,i)=>a+BL[i].b-BL[i].a+1,0),dd=ix.reduce((a,i)=>a+dn(BL[i]),0),p=dd/tot;
 h+=`<div class="hero"><svg class="ring" width="100" height="100" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" cx="50" cy="50" r="44" style="stroke-dashoffset:${276.5*(1-p)}"/></svg><div><b style="font-size:30px">${dd}/${tot}</b><div class="sub">done today ${p==1?'🎉':'💪'}</div></div></div>`;
 ix.forEach((i,k)=>h+=card(i,k+1));
 const tb=BL.filter((b,i)=>D[i]==t),tl=tb.reduce((a,b)=>a+b.b-b.a+1,0);
 if(S.bonus[t])h+=`<div class="card" style="--i:4"><h3>⭐ Bonus done</h3><div class="sub">${S.bonus[t].n} — lecture ${S.bonus[t].l}</div></div>`;
 else if(tb.length&&tb.every(full)&&tl<3&&ix.every(i=>full(BL[i]))){const o=CH.filter(c=>c.sub!=tb[0].ch.sub&&c.ph==tb[0].ch.ph&&dc(c)<c.total);
  if(o.length)h+=`<div class="card" style="--i:4"><h3>⭐ Bonus lecture (only 1)</h3><select id="bs">${o.map(c=>`<option value="${c.id}">${c.name} (next: lecture ${dc(c)+1})</option>`).join('')}</select><button class="btn" onclick="bonus()">Mark 1 bonus lecture done</button></div>`}
 return h+pk}
function bonus(){const id=$('#bs').value,c=CH.find(x=>x.id==id),t=today();if(!confirm('Mark 1 lecture of '+c.name+' as done? It becomes your next chapter and freezes until finished.'))return;S.done[id]=dc(c)+1;S.bc[id]=(S.bc[id]||0)+1;S.log[t]=(S.log[t]||0)+1;S.bonus[t]={n:c.name,l:S.done[id]};S.order=S.order.filter(x=>x!=id);const k=S.order.findIndex(x=>{const q=CH.find(z=>z.id==x);return dc(q)<q.total});S.order.splice(k<0?S.order.length:k,0,id);save();render();pop(60)}
function openDelay(i){const m=document.createElement('div');m.className='md';m.innerHTML=`<div><h3>⏳ Delay ${BL[i].ch.name}</h3><div class="sub">Now ${fd(D[i])}. Pick the new date.</div><input type="date" id="dd" min="${add(D[i],1)}" value="${add(D[i],1)}"><button class="btn" id="sv">Save delay</button><button class="ghost" style="width:100%" id="cx">Cancel</button></div>`;document.body.append(m);
 $('#cx').onclick=()=>m.remove();$('#sv').onclick=()=>{const v=$('#dd').value,d=diff(D[i],v);if(!(d>0))return toast('Choose a later date');S.delay[i]=(S.delay[i]||0)+d;save();m.remove();render();toast('Delayed to '+fd(v))}}
let PQ='';
function vPlan(){return '<h1>Full Plan</h1><input type="search" id="q" placeholder="🔍 Search chapter, subject, date…" value="'+PQ.replace(/"/g,'')+'" oninput="PQ=this.value;$(\'#pl\').innerHTML=planList()"><div id="pl">'+planList()+'</div>'}
function planList(){const qq=PQ.toLowerCase().trim();let h='',ph='',prev='';
 const rs=s=>{const q=new Date(s+'T00:00:00');return `<div class="row" style="border-left-color:#fdcb6e;--i:0"><div class="d">${q.getDate()}<small>${q.toLocaleDateString('en-IN',{month:'short'})}</small></div><div class="g"><b>🌴 Pressure-release day</b></div></div>`};
 BL.forEach((b,i)=>{const p=b.ch.ph,st=stat(i),dg=!full(b)&&(st=='over'||SH[i]>0);if(qq&&!(b.ch.name+' '+(b.ch.sub=='M'?'maths':'reasoning')+' '+(p=='pre'?'prelims':'mains')+' '+fd(D[i])).toLowerCase().includes(qq)){prev=D[i];return}if(p!=ph){ph=p;h+=`<h2 class="sec">${p=='pre'?'📘 Prelims':'🏆 Mains'}</h2>`}
 (qq?[]:S.skips.filter(s=>s>prev&&s<D[i])).forEach(s=>h+=rs(s));prev=D[i];const dt=new Date(D[i]+'T00:00:00');
 h+=`<div class="row ${b.ch.sub} ${st} ${dg?'dg':''}" style="--i:${i%20}"><div class="d">${dt.getDate()}<small>${dt.toLocaleDateString('en-IN',{month:'short'})}</small></div><div class="g"><b>${b.ch.name}</b><small>${b.ch.sub=='M'?'Maths':'Reasoning'} · L${b.a}${b.b>b.a?'–'+b.b:''}/${b.ch.total}${SH[i]>0&&!full(b)?' · 🚨 +'+SH[i]+'d':''}</small></div>${p=='mains'&&!full(b)?`<button class="ghost" style="margin:0" onclick="openDelay(${i})">⏳</button>`:`<span style="font-size:22px">${{done:'✅',locked:'🔒',over:'🚨',today:'⭐'}[st]}</span>`}</div>`});return h||'<div class="sub" style="margin-top:14px">No matching days.</div>'}
function vStats(){const t=today(),tot=CH.reduce((a,c)=>a+c.total,0),d=CH.reduce((a,c)=>a+dc(c),0),exp=BL.reduce((a,b,i)=>a+(D[i]<=t?b.b-b.a+1:0),0),df=d-exp;
 let s=0,k=0,x=S.log[t]>0?t:add(t,-1);while(S.log[x]>0){k++;x=add(x,-1)}
 const g=(ph,sb)=>{const l=CH.filter(c=>c.ph==ph&&c.sub==sb);return[l.reduce((a,c)=>a+dc(c),0),l.reduce((a,c)=>a+c.total,0)]};
 const bar=(n,[a,b],c)=>`<b>${n}</b> <small style="color:var(--mut)">${a}/${b}</small><div class="bar" style="--c:${c}"><i style="width:${a/b*100}%"></i></div>`;
 const pre=BL.filter(b=>b.ch.ph=='pre'),ml=BL.length-1,last=D[ml],pe=D[BL.findIndex(b=>b.ch.ph=='mains')-1];
 return `<h1>Your Stats</h1>
 <div class="hero"><svg class="ring" width="100" height="100" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" cx="50" cy="50" r="44" style="stroke-dashoffset:${276.5*(1-d/tot)}"/></svg><div><b style="font-size:30px">${Math.round(d/tot*100)}%</b><div class="sub">${d} of ${tot} lectures</div></div></div>
 <div class="grid"><div class="stat" style="--i:1"><b>🔥 ${k}</b><span>day streak</span></div><div class="stat" style="--i:2"><b style="color:${df<0?'#ff4757':'#00b894'}">${df<0?df:'+'+df}</b><span>${df<0?'lectures behind plan':df==0?'exactly on plan':'lectures ahead of plan'}</span></div><div class="stat" style="--i:3"><b>${CH.filter(c=>dc(c)>=c.total).length}/${CH.length}</b><span>chapters done</span></div><div class="stat" style="--i:4"><b>${S.log[t]||0}</b><span>done today</span></div></div>
 <h2 class="sec">By section</h2>${bar('📘 Maths Prelims',g('pre','M'),'#6c5ce7')}${bar('📘 Reasoning Prelims',g('pre','R'),'#00b894')}${bar('🏆 Maths Mains',g('mains','M'),'#fd79a8')}${bar('🏆 Reasoning Mains',g('mains','R'),'#fdcb6e')}
 <h2 class="sec">Dates</h2><div class="card" style="--i:2">Prelims end: <b>${fd(pe)}</b><br>Mains projected end: <b>${fd(last)}</b>${diff(BASE_END,last)>0?` <span style="color:var(--red)">(🚨 +${diff(BASE_END,last)} days late)</span>`:''}<br>Days left: <b>${Math.max(0,diff(t,last))}</b></div>
 <h2 class="sec">Tools</h2><div class="card" style="--i:3"><div class="sub">Preview date</div><input type="date" value="${S.sim}" onchange="S.sim=this.value;render()"></div>
 <h2 class="sec">Account</h2><div class="card" style="--i:4"><div class="sub">☁️ Saved in Firebase · signed in as <b>${(AUTH&&AUTH.currentUser&&AUTH.currentUser.email)||''}</b></div>${instBtn()}<button class="ghost" style="width:100%;margin-top:12px" onclick="logout()">Sign out</button><button class="ghost" style="width:100%;margin-top:4px;color:#d6283a" onclick="resetAll()">Reset all progress</button></div>`}

/* ===== Firebase: sign-in + cloud save (Firestore). Nothing is stored in the browser. ===== */
let AUTH,DB,REF,UNSUB,loadT,saveT=null,seq=0,acked=0,IP=null,GS={m:'loading'};
const strip=s=>{const r=Object.assign({},s);delete r.sim;return r};
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const readOld=()=>{try{const o=JSON.parse(localStorage.getItem('bp')||'null');return o&&typeof o=='object'?o:null}catch(e){return null}};
function setSync(k){const e=$('#sy');if(!navigator.onLine&&k!='ok')k='off';
 const m={ok:['☁️ Saved',''],saving:['⏳ Saving…','sv'],err:['⚠️ Not saved','er'],off:['📡 Offline – not saved yet','er']}[k];
 e.textContent=m[0];e.className='sy '+m[1];e.style.display=''}
function gate(m,msg){GS={m,msg};$('nav').style.display='none';$('#sy').style.display='none';
 const C={loading:['☁️','Loading your progress…','Connecting to Firebase.',''],
  login:['🎯','Bank Prep Tracker','Sign in with Google so your progress is saved safely in the cloud and follows you on every device.','<button class="btn" onclick="login()">Sign in with Google</button>'+instBtn()],
  config:['🛠️','Firebase not set up yet','Open <b>firebase-config.js</b>, paste your Firebase web-app config (SETUP.md · Step 4) and upload it again.',''],
  offline:['📡','Can’t reach Firebase','Check your internet connection and try again.','<button class="btn" onclick="location.reload()">Try again</button>'],
  error:['⚠️','Something went wrong','','<button class="btn" onclick="location.reload()">Reload</button>']}[m];
 $('#v').innerHTML=`<div class="gate"><div class="gi">${C[0]}</div><h1>${C[1]}</h1><div class="sub">${m=='error'?msg:C[2]}</div>${m=='login'&&msg?`<div class="warn">${msg}</div>`:''}${C[3]}</div>`}
function errMsg(e){const c=e.code||'';
 if(c=='auth/unauthorized-domain')return 'This web address is not allowed yet. In Firebase → Authentication → Settings → Authorized domains, add: <b>'+location.hostname+'</b>';
 if(c=='auth/operation-not-allowed')return 'Google sign-in is switched off. In Firebase → Authentication → Sign-in method, enable Google.';
 if(c=='auth/network-request-failed')return 'No internet connection.';
 return 'Sign-in failed ('+(c||e.message)+')'}
function login(){const p=new firebase.auth.GoogleAuthProvider();
 AUTH.signInWithPopup(p).catch(e=>{
  if(e.code=='auth/popup-closed-by-user'||e.code=='auth/cancelled-popup-request')return;
  if(e.code=='auth/popup-blocked'||e.code=='auth/operation-not-supported-in-this-environment')return AUTH.signInWithRedirect(p);
  gate('login',errMsg(e))})}
function logout(){if(!confirm('Sign out of this device?'))return;flush();AUTH.signOut()}
function startFB(){gate('loading');
 if(typeof firebase==='undefined')return gate('offline');
 const cfg=window.FIREBASE_CONFIG;
 if(!cfg||!cfg.apiKey||/PASTE_/.test(cfg.apiKey+cfg.projectId))return gate('config');
 try{firebase.initializeApp(cfg);AUTH=firebase.auth();DB=firebase.firestore();DB.settings({experimentalAutoDetectLongPolling:true})}catch(e){return gate('error',e.message)}
 AUTH.getRedirectResult().catch(e=>gate('login',errMsg(e)));
 AUTH.onAuthStateChanged(u=>{
  if(UNSUB){UNSUB();UNSUB=null}clearTimeout(loadT);clearTimeout(saveT);saveT=null;
  if(!u){ready=false;REF=null;S=Object.assign(DEF(),{sim:''});return gate('login')}
  gate('loading');REF=DB.collection('users').doc(u.uid);
  loadT=setTimeout(()=>gate('error','Could not load your data. Check your internet, and that the Firestore database is created and the rules are published (SETUP.md · Step 3). Then reload.'),15000);
  UNSUB=REF.onSnapshot(onSnap,err=>{clearTimeout(loadT);
   if(ready)return setSync('err');
   gate('error',err.code=='permission-denied'?'Firestore refused access. Publish the security rules from SETUP.md · Step 3, then reload.':'Firestore error: '+(err.code||err.message))})})}
function onSnap(snap){
 if(!ready&&snap.metadata.fromCache)return; /* wait for the real server answer */
 clearTimeout(loadT);
 if(ready){ /* a change made on another device */
  if(saveT||snap.metadata.hasPendingWrites||!snap.exists)return;
  const r=snap.data().state;if(!r)return;const n=Object.assign(DEF(),r);
  if(canon(n)==canon(strip(S)))return;
  S=Object.assign(n,{sim:S.sim});const a=document.activeElement;if(!(a&&/INPUT|SELECT/.test(a.tagName)))render();return}
 let st=snap.exists&&snap.data().state,old=false;
 if(!st){st=readOld();old=!!st}
 S=Object.assign(DEF(),st||{},{sim:''});ready=true;$('nav').style.display='';
 if(!snap.exists){push();if(old){try{localStorage.removeItem('bp')}catch(e){}toast('Imported your old progress ☁️')}}
 render();setSync('ok')}
function save(){if(!ready)return;clearTimeout(saveT);setSync('saving');saveT=setTimeout(flush,1000)}
function flush(){if(!ready||!REF||!saveT)return;clearTimeout(saveT);saveT=null;push()}
function push(){const n=++seq;
 REF.set({state:JSON.parse(JSON.stringify(strip(S))),updated:firebase.firestore.FieldValue.serverTimestamp()})
  .then(()=>{acked=Math.max(acked,n);if(acked==seq)setSync('ok')})
  .catch(e=>{setSync('err');toast('⚠️ Not saved: '+(e.code||e.message))})}
function resetAll(){if(!confirm('Erase ALL progress? This also deletes it from the cloud.'))return;
 clearTimeout(saveT);saveT=null;S=Object.assign(DEF(),{sim:S.sim});push();render();toast('Progress reset')}
addEventListener('visibilitychange',()=>{if(document.visibilityState=='hidden')flush()});addEventListener('pagehide',flush);
addEventListener('offline',()=>ready&&setSync('off'));addEventListener('online',()=>ready&&setSync(acked==seq&&!saveT?'ok':'saving'));
/* "Install app" button (shows only when Chrome says the app is installable) */
const instBtn=()=>IP?'<button class="ghost" style="width:100%;margin-top:12px" onclick="doInstall()">📲 Install app on this phone</button>':'';
function doInstall(){if(!IP)return;IP.prompt();IP.userChoice.finally(()=>{IP=null;ready?render():gate(GS.m,GS.msg)})}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e;if(!ready&&GS.m=='login')gate('login',GS.msg)});
addEventListener('appinstalled',()=>{IP=null;toast('App installed 🎉')});
const T={today:vToday,plan:vPlan,stats:vStats};
let FRESH=true,LASTD='';
function render(){if(!ready)return;calc();LASTD=today();$('#v').className=FRESH?'':'na';FRESH=false;$('#v').innerHTML=bn()+T[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
function go(t){tab=t;FRESH=true;scrollTo(0,0);render()}
startFB();setInterval(()=>{if(ready&&today()!=LASTD&&document.visibilityState=='visible'&&!document.querySelector('.md')&&document.activeElement.tagName!='INPUT')render()},60000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
